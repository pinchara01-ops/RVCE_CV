name: Quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Contracts, retrieval, and browser build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      qdrant:
        image: qdrant/qdrant:v1.11.5
        ports:
          - 6333:6333

    env:
      QDRANT_URL: http://127.0.0.1:6333
      COLLECTION_NAME: video_windows_query_test
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-processing.txt

      - name: Install Python test dependencies
        run: python -m pip install -r requirements-processing.txt -r requirements.txt

      - name: Wait for isolated Qdrant
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:6333/readyz; then
              exit 0
            fi
            sleep 1
          done
          echo "Qdrant did not become ready within 30 seconds."
          exit 1

      - name: Run indexing contract tests
        run: python -m pytest processing_indexing/tests -m "not integration" -q

      - name: Run retrieval tests against Qdrant
        run: python -m pytest query_retrieval/tests -q --require-qdrant

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: processing_debug_frontend/package-lock.json

      - name: Install browser dependencies
        working-directory: processing_debug_frontend
        run: npm ci

      - name: Run browser tests, lint, types, and production build
        working-directory: processing_debug_frontend
        run: |
          npm test
          npm run lint
          npm run typecheck
          npm run build
